# ALSA configuration for Pico I2S Audio (Pimoroni Audio Pack)
# This configures the I2S audio interface for Raspberry Pi Pico

pcm.picoi2s {
    type hw
    card 0
    device 0
    channels 2
    rate 48000
    format S16_LE
}

ctl.picoi2s {
    type hw
    card 0
}

# Set as default
pcm.!default {
    type plug
    slave.pcm "picoi2s"
}

ctl.!default {
    type hw
    card 0
}